name: "[Bot] rebase pull request"

on:
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  rebase-pr:
    name: Rebase pull request
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request != '' && contains(github.event.comment.body, '/rebase') && github.repository == 'trezor/trezor-suite'
    steps:
      - name: Check authorization
        uses: actions/github-script@00f12e3e20659f42342b1c0226afda7f7c042325
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const prAuthor = pr.user.login;
            const commenter = context.actor;

            if (commenter === prAuthor) {
              return;
            }

            try {
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: commenter
              });

              if (!['admin', 'write'].includes(permission.permission)) {
                core.setFailed(`User ${commenter} is not authorized`);
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `@${commenter} Only the PR author or maintainers can trigger a rebase.`
                });
              }
            } catch (error) {
              core.setFailed(`User ${commenter} is not authorized`);
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `@${commenter} Only the PR author or maintainers can trigger a rebase.`
              });
            }

      - name: Respond in pull request
        uses: actions/github-script@00f12e3e20659f42342b1c0226afda7f7c042325
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "Start rebasing: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            })
      - name: Generate GitHub App token
        id: trezor-bot-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.TREZOR_BOT_APP_ID }}
          private-key: ${{ secrets.TREZOR_BOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          token: ${{ steps.trezor-bot-token.outputs.token }}
      - name: Auto rebase pull request
        uses: cirrus-actions/rebase@b87d48154a87a85666003575337e27b8cd65f691
        with:
          autosquash: true
        env:
          GITHUB_TOKEN: ${{ steps.trezor-bot-token.outputs.token }}
      - name: Report failure
        if: ${{ failure() }}
        uses: actions/github-script@00f12e3e20659f42342b1c0226afda7f7c042325
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "Rebasing failed, please rebase manually."
            })
