name: "[Build] suite-desktop apps"

on:
  workflow_dispatch:
    inputs:
      build_linux:
        description: "Build Linux version"
        required: false
        type: boolean
        default: true
      build_mac:
        description: "Build macOS version"
        required: false
        type: boolean
        default: true
      build_win:
        description: "Build Windows version"
        required: false
        type: boolean
        default: true
      create_release:
        description: "Create a GitHub draft release with artifacts"
        required: false
        type: boolean
        default: false

env:
  DESKTOP_APP_NAME: "Dash-Trezor-Suite"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  suite-desktop:
    if: |
      github.event_name == 'workflow_dispatch' &&
      ((matrix.platform == 'linux' && github.event.inputs.build_linux == 'true') ||
       (matrix.platform == 'mac' && github.event.inputs.build_mac == 'true'))
    name: Build suite-desktop-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-14
            platform: mac
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true
      - name: Install node and yarn
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install deps and build libs
        run: |
          yarn install --immutable
          yarn message-system-sign-config
          yarn workspace @trezor/suite-data build:lib
          yarn workspace @trezor/transport-bridge build:lib

      - name: Build ${{ matrix.platform }} suite-desktop
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          yarn workspace @trezor/suite-desktop build:${{ matrix.platform }}
          bash packages/suite-desktop-core/scripts/gnupg-sign.sh
          mv packages/suite-desktop/build-electron/* .

      - name: Upload suite-desktop production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suite-desktop-${{ matrix.platform }}
          path: |
            Dash-Trezor-Suite*
            latest*.yml
          retention-days: 3

      - name: Upload suite-desktop mac-arm artifact
        if: matrix.os == 'macos-14'
        uses: actions/upload-artifact@v4
        with:
          name: suite-desktop-mac-arm-dmg
          path: |
            Dash-Trezor-Suite-*-mac-arm64.dmg
          retention-days: 3

  suite-desktop-win:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_win == 'true'
    name: Build suite-desktop-win
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      platform: win
    container:
      image: electronuserland/builder:18-wine
      options: --user 1001
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true
      - name: Install node and yarn
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install deps and build libs
        run: |
          yarn install --immutable
          yarn message-system-sign-config

      - name: Build libs
        run: |
          yarn workspace @trezor/suite-data build:lib
          yarn workspace @trezor/transport-bridge build:lib

      - name: Build ${{env.platform}} suite-desktop
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          yarn workspace @trezor/suite-desktop build:${{env.platform}}
          bash packages/suite-desktop-core/scripts/gnupg-sign.sh
          mv packages/suite-desktop/build-electron/* .

      - name: Upload suite-desktop production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suite-desktop-${{env.platform}}
          path: |
            Dash-Trezor-Suite*
            latest*.yml
          retention-days: 3

  create-release:
    if: |
      always() &&
      github.event.inputs.create_release == 'true' &&
      (needs.suite-desktop.result == 'success' || needs.suite-desktop.result == 'skipped') &&
      (needs.suite-desktop-win.result == 'success' || needs.suite-desktop-win.result == 'skipped') &&
      (needs.suite-desktop.result == 'success' || needs.suite-desktop-win.result == 'success')
    name: Create GitHub draft release
    runs-on: ubuntu-latest
    needs: [suite-desktop, suite-desktop-win]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download suite-desktop apps
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: suite-desktop-*
          path: artifacts

      - name: Prepare artifacts for release
        run: |
          mkdir -p release-artifacts
          if [ -d "artifacts" ]; then
            find artifacts -type f -name "Dash-Trezor-Suite*" -exec cp -v {} release-artifacts/ \;
            find artifacts -type f -name "latest*.yml" -exec cp -v {} release-artifacts/ \;
          else
            echo "No artifacts directory found. Skipping artifact preparation."
          fi
          ls -R release-artifacts

      - name: Create GitHub draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh config set prompt disabled
          # Only create release if there are artifacts to upload
          if [ "$(ls -A release-artifacts)" ]; then
            VERSION=$(jq -r .version packages/suite-desktop/package.json)
            TAG="v${VERSION}-build-${{ github.run_id }}"
            gh release create ${TAG} --draft --title "v${VERSION} (Build ${{ github.run_id }})" ./release-artifacts/*
          else
            echo "No artifacts found in release-artifacts/. Skipping release creation."
          fi
